<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <title>StreamNet Edge Core - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      background-color: #121417; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    .card { 
      background: #1a1d24; 
      border: 1px solid #2a2f3a; 
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-4">

  <div class="card w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
    <!-- Header -->
    <div class="flex flex-col items-center mb-8 text-center">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center shadow-lg shadow-orange-950/50 mb-4">
        <i class="fa-solid fa-lock text-2xl text-white"></i>
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">StreamNet Edge Core</h1>
      <p class="text-xs text-gray-400 mt-1">Authentifizierung erforderlich</p>
    </div>

    <!-- Fehlermeldung bei falschem Login -->
    {% if error %}
    <div class="mb-5 p-3 rounded-xl bg-rose-950/60 border border-rose-800/60 text-rose-400 text-xs flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Formular -->
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Benutzername</label>
        <div class="flex items-center bg-[#121417] px-3.5 py-2.5 rounded-xl border border-[#2a2f3a] focus-within:border-orange-500 transition">
          <i class="fa-solid fa-user text-xs text-gray-500 mr-2.5"></i>
          <input type="text" name="username" required autofocus placeholder="dermichel"
                 class="w-full bg-transparent text-sm text-gray-200 placeholder-gray-600 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Passwort</label>
        <div class="flex items-center bg-[#121417] px-3.5 py-2.5 rounded-xl border border-[#2a2f3a] focus-within:border-orange-500 transition">
          <i class="fa-solid fa-key text-xs text-gray-500 mr-2.5"></i>
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full bg-transparent text-sm text-gray-200 placeholder-gray-600 outline-none">
        </div>
      </div>

      <button type="submit" 
              class="w-full mt-2 py-3 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-orange-950/40 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-right-to-bracket"></i> Anmelden
      </button>
    </form>

    <div class="mt-6 text-center">
      <span class="text-[10px] text-gray-500 font-mono">Proxy Gateway Protected · 50.7.37.202</span>
    </div>
  </div>

</body>
</html>
